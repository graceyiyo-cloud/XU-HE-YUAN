<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>敘禾苑自動備份授權</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f1ea; color: #434943; font-family: "Microsoft JhengHei", sans-serif; }
    main { width: min(520px, 100%); padding: 36px; background: #fff; border: 1px solid #d9d3c8; border-radius: 16px; box-shadow: 0 16px 40px rgba(60, 64, 58, .1); }
    h1 { margin: 0 0 12px; color: #647269; font: 700 26px/1.4 Georgia, "Noto Serif TC", serif; }
    p { color: #6d716c; line-height: 1.8; }
    button { width: 100%; padding: 13px 18px; border: 0; border-radius: 10px; background: #718279; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { margin-top: 18px; padding: 12px 14px; border-radius: 9px; background: #f5f6f3; font-size: 14px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>敘禾苑自動備份授權</h1>
    <p>請使用管理員帳號 <strong>jingchuantw@gmail.com</strong>。授權資料只會傳到這台電腦的本機備份程式，不會修改 Firebase 雲端資料。</p>
    <button id="authorize" type="button">授權這台電腦執行每日備份</button>
    <div id="status" role="status">正在確認登入狀態…</div>
  </main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

    const ADMIN_EMAIL = 'jingchuantw@gmail.com';
    const firebaseConfig = {
      apiKey: 'AIzaSyDREvduzrja4xjF-RCpKa-qv45JZCw9tjI',
      authDomain: 'gen-lang-client-0168131217.firebaseapp.com',
      projectId: 'gen-lang-client-0168131217',
      storageBucket: 'gen-lang-client-0168131217.firebasestorage.app',
      messagingSenderId: '620488371764',
      appId: '1:620488371764:web:d5eb9d1dff62d66bab2461'
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    const button = document.querySelector('#authorize');
    const status = document.querySelector('#status');
    let currentUser = null;

    onAuthStateChanged(auth, user => {
      currentUser = user;
      status.textContent = user
        ? `已登入：${user.email}\n請按上方按鈕完成本機授權。`
        : '尚未登入，按下按鈕後請選擇管理員 Google 帳號。';
    });

    button.addEventListener('click', async () => {
      button.disabled = true;
      status.textContent = '正在授權…';
      try {
        let user = currentUser;
        if (!user) user = (await signInWithPopup(auth, new GoogleAuthProvider())).user;
        const email = (user.email || '').toLowerCase();
        if (email !== ADMIN_EMAIL) {
          await signOut(auth);
          throw new Error(`登入帳號不是管理員：${email || '無 Email'}`);
        }
        const response = await fetch('http://127.0.0.1:8765/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, refreshToken: user.refreshToken })
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || '本機授權儲存失敗');
        status.textContent = '授權完成。現在可以關閉這個頁面。';
        button.hidden = true;
      } catch (error) {
        console.error(error);
        status.textContent = `授權失敗：${error?.message || error}`;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
